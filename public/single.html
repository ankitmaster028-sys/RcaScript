<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Pro – Single User Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #ec4899;
      --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
      --dark: #1e1b4b; --darker: #0f0e2e; --light: #f8fafc; --gray: #94a3b8;
      --bg: #0f0e2e; --bg-secondary: #1e1b4b; --text: #f8fafc; --text-secondary: #94a3b8;
      --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1);
    }
    [data-theme="light"] {
      --bg: #f8fafc; --bg-secondary: #ffffff; --text: #1e1b4b; --text-secondary: #64748b;
      --card: rgba(255,255,255,0.8); --border: rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }

    .bg-animation { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .bg-animation .circle { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.2; animation: float 20s infinite ease-in-out; }
    .circle:nth-child(1) { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
    .circle:nth-child(2) { width: 300px; height: 300px; background: var(--secondary); bottom: -50px; right: -50px; animation-delay: -5s; }
    @keyframes float { 0%,100%{transform:translate(0,0)scale(1)} 33%{transform:translate(30px,-30px)scale(1.1)} 66%{transform:translate(-20px,20px)scale(0.9)} }

    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(15,14,46,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 30px; height: 70px; display: flex; align-items: center; justify-content: space-between; }
    [data-theme="light"] .navbar { background: rgba(255,255,255,0.9); }
    .nav-brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 20px; text-decoration: none; color: var(--text); }
    .nav-logo { width: 40px; height: 40px; background: linear-gradient(135deg,var(--primary),var(--secondary)); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
    .nav-actions { display: flex; align-items: center; gap: 16px; }
    .theme-toggle { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .back-btn { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .back-btn:hover { color: var(--primary); }
    .hamburger { display: none; font-size: 24px; cursor: pointer; color: var(--text); }

    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 100px 20px 40px; }
    .login-box { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 50px 40px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
    .login-box .logo { width: 80px; height: 80px; background: linear-gradient(135deg,var(--primary),var(--secondary)); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; font-size: 36px; color: white; box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .login-box h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .login-box .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; }
    .input-group { position: relative; margin-bottom: 18px; }
    .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
    .input-group input { width: 100%; padding: 16px 18px 16px 50px; background: rgba(128,128,128,0.05); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-size: 15px; font-family: inherit; outline: none; }
    .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(99,102,241,0.15); }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
    .btn-primary { background: linear-gradient(135deg,var(--primary),var(--primary-dark)); color: #fff; box-shadow: 0 10px 30px rgba(99,102,241,0.3); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
    .btn-sm { padding: 10px 18px; width: auto; font-size: 13px; border-radius: 10px; }
    .btn-success { background: linear-gradient(135deg,var(--success),#16a34a); color: #fff; }
    .btn-warning { background: linear-gradient(135deg,var(--warning),#d97706); color: #fff; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(99,102,241,0.1); border-color: var(--primary); }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
    .error-msg.show { display: block; }
    .hint { color: var(--text-secondary); font-size: 12px; margin-top: 6px; text-align: left; }

    .dashboard { display: none; padding: 90px 30px 40px; max-width: 1100px; margin: 0 auto; }
    .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 16px; }
    .dash-header h2 { font-size: 26px; font-weight: 700; }
    .user-info-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; display: flex; align-items: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
    .user-avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--secondary)); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: white; }
    .user-details { flex: 1; min-width: 200px; }
    .user-details .name { font-size: 20px; font-weight: 700; }
    .user-details .id { font-size: 13px; color: var(--text-secondary); }
    .coin-display { display: flex; align-items: center; gap: 8px; background: linear-gradient(135deg,#f59e0b,#d97706); padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 14px; color: white; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
    .stat-card .icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 16px; }
    .icon.purple { background: rgba(99,102,241,0.2); color: var(--primary); }
    .icon.green { background: rgba(34,197,94,0.2); color: var(--success); }
    .icon.pink { background: rgba(236,72,153,0.2); color: var(--secondary); }
    .icon.blue { background: rgba(59,130,246,0.2); color: var(--info); }
    .stat-card .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }

    .level-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
    .level-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
    .level-info { display: flex; align-items: center; gap: 15px; }
    .level-badge { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: white; }
    .level-badge.a1 { background: linear-gradient(135deg,#22c55e,#16a34a); }
    .level-badge.a2 { background: linear-gradient(135deg,#3b82f6,#2563eb); }
    .level-badge.b1 { background: linear-gradient(135deg,#8b5cf6,#7c3aed); }
    .level-badge.b2 { background: linear-gradient(135deg,#ec4899,#db2777); }
    .level-badge.c1 { background: linear-gradient(135deg,#f59e0b,#d97706); }
    .level-badge.c2 { background: linear-gradient(135deg,#ef4444,#dc2626); }
    .level-title { font-size: 18px; font-weight: 600; }
    .level-subtitle { font-size: 12px; color: var(--text-secondary); }

    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    .skill-item { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .skill-item.completed { border-color: var(--success); }
    .skill-item-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .skill-item-info { display: flex; align-items: center; gap: 10px; }
    .skill-item i { font-size: 20px; }
    .skill-name { font-size: 14px; font-weight: 600; }
    .skill-status { font-size: 10px; padding: 3px 8px; border-radius: 20px; }
    .skill-status.completed { background: rgba(34,197,94,0.15); color: var(--success); }
    .skill-status.not-completed { background: rgba(239,68,68,0.15); color: var(--danger); }
    .skill-status.in-progress { background: rgba(245,158,11,0.15); color: var(--warning); }
    .activity-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .activity-chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; gap: 6px; }

    .progress-overlay { position: fixed; inset: 0; background: rgba(15,14,46,0.95); backdrop-filter: blur(10px); z-index: 1000; display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
    .progress-overlay.active { display: flex; }
    .progress-box { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 500px; text-align: center; }
    .progress-icon { width: 80px; height: 80px; background: linear-gradient(135deg,var(--primary),var(--secondary)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; margin: 0 auto 25px; }
    .progress-bar-container { background: rgba(255,255,255,0.05); border-radius: 12px; height: 12px; overflow: hidden; margin: 15px 0; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,var(--primary),var(--secondary)); transition: width .2s; border-radius: 12px; }
    .progress-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); }
    .progress-log { margin-top: 20px; max-height: 180px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; font-size: 12px; }
    .log-item { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-secondary); }
    .log-item.success { color: var(--success); }
    .log-item.error { color: var(--danger); }
    .log-item.info { color: var(--info); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,14,46,0.8); backdrop-filter: blur(10px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 35px; width: 100%; max-width: 420px; }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; min-width: 280px; max-width: 400px; }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }

    .mobile-menu { display: none; position: fixed; top: 70px; left: 0; right: 0; background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 20px; flex-direction: column; gap: 16px; z-index: 999; }
    .mobile-menu.active { display: flex; }
    .mobile-menu a { color: var(--text); text-decoration: none; font-weight: 500; padding: 10px; border-radius: 8px; }
    .mobile-menu a:hover { background: var(--card); }

    @media (max-width: 768px) {
      .nav-actions .back-btn span { display: none; }
      .hamburger { display: block; }
      .dash-header { flex-direction: column; align-items: flex-start; }
      .level-header { flex-direction: column; align-items: flex-start; }
      .skills-grid { grid-template-columns: 1fr; }
      .user-info-card { flex-direction: column; text-align: center; }
      .login-box { padding: 35px 25px; }
    }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="circle"></div><div class="circle"></div></div>
  <div class="toast-container" id="toastContainer"></div>

  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="nav-logo"><i class="fas fa-graduation-cap"></i></div>
      <span>IELTS Pro</span>
    </a>
    <div class="nav-actions">
      <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> <span>Back to Home</span></a>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme"><i class="fas fa-moon" id="themeIcon"></i></button>
      <div class="hamburger" onclick="toggleMobile()"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="/">Home</a>
    <a href="/single">Single Mode</a>
    <a href="/bulk">Bulk Mode</a>
    <button class="theme-toggle" onclick="toggleTheme()" style="width:100%;justify-content:center;">
      <i class="fas fa-moon" id="themeIconMobile"></i> Toggle Theme
    </button>
  </div>

  <div class="login-container" id="loginScreen">
    <div class="login-box">
      <div class="logo"><i class="fas fa-user"></i></div>
      <h1>Single User Mode</h1>
      <p class="subtitle">Login with your User ID to access your IELTS dashboard</p>
      <div class="input-group">
        <i class="fas fa-id-card"></i>
        <input type="text" id="userId" placeholder="Enter User ID (e.g. 8374837)" autocomplete="username" />
      </div>
      <div class="hint"><i class="fas fa-info-circle"></i> Enter only 1 User ID</div>
      <div class="input-group" style="margin-top:15px;">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" value="Password" />
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
        <span>Login</span><i class="fas fa-arrow-right"></i>
      </button>
      <div class="error-msg" id="loginError"></div>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="dash-header">
      <h2><i class="fas fa-chart-line" style="color:var(--primary);margin-right:10px;"></i>Dashboard</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-warning btn-sm" onclick="showAddCoinModal()"><i class="fas fa-coins"></i> Add Coins</button>
        <button class="btn btn-success btn-sm" onclick="triggerAutomation('all','ALL')"><i class="fas fa-check-double"></i> Complete ALL Levels</button>
        <button class="btn btn-secondary btn-sm" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <div class="user-info-card">
      <div class="user-avatar" id="userAvatar">U</div>
      <div class="user-details">
        <div class="name" id="userName">User</div>
        <div class="id" id="userIdDisplay">ID: --</div>
      </div>
      <div class="coin-display"><i class="fas fa-coins"></i><span id="coinCount">0 Coins</span></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="icon purple"><i class="fas fa-layer-group"></i></div><div class="label">Total Levels</div><div class="value" id="totalLevels">6</div></div>
      <div class="stat-card"><div class="icon green"><i class="fas fa-check-circle"></i></div><div class="label">Completed</div><div class="value" id="completedLevels">0</div></div>
      <div class="stat-card"><div class="icon pink"><i class="fas fa-clock"></i></div><div class="label">In Progress</div><div class="value" id="inProgressLevels">0</div></div>
      <div class="stat-card"><div class="icon blue"><i class="fas fa-tasks"></i></div><div class="label">Pending Tasks</div><div class="value" id="totalTasks">0</div></div>
    </div>

    <div id="levelsContainer"></div>
  </div>

  <div class="progress-overlay" id="progressOverlay">
    <div class="progress-box">
      <div class="progress-icon"><i class="fas fa-cog fa-spin"></i></div>
      <h3 id="progressTitle">Automation Active</h3>
      <div id="currentTask" style="color:var(--text-secondary);font-size:13px;margin:10px 0">Executing...</div>
      <div class="progress-bar-container"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="progress-stats"><span id="progressPercent">0%</span><span id="progressCount">0 / 0</span></div>
      <div class="progress-log" id="progressLog"></div>
    </div>
  </div>

  <div class="modal-overlay" id="coinModal">
    <div class="modal-box">
      <h3 style="margin-bottom:20px"><i class="fas fa-coins" style="color:var(--warning)"></i> Add Coins</h3>
      <div class="input-group" id="passkeyGroup">
        <i class="fas fa-key"></i>
        <input type="password" id="passkeyInput" placeholder="Enter Pass Key" />
      </div>
      <div class="input-group" id="coinAmountGroup" style="display:none">
        <i class="fas fa-coins"></i>
        <input type="number" id="coinAmount" placeholder="Amount (1-500)" min="1" max="500" />
      </div>
      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn btn-secondary" onclick="closeCoinModal()" style="flex:1">Cancel</button>
        <button class="btn btn-primary" id="coinModalBtn" onclick="handleCoinStep()" style="flex:1">Verify Key</button>
      </div>
      <div class="error-msg" id="coinError"></div>
    </div>
  </div>

  <script>
    let user = null;
    let allLevels = [];
    let coinStep = 1;
    let pollTimer = null;
    let savedPasskey = "";

    async function api(path, options = {}) {
      const token = localStorage.getItem('rca_token') || '';
      const res = await fetch(path, {
        method: options.method || "GET",
        headers: {
          "Content-Type": "application/json",
          "x-client-ua": navigator.userAgent,
          "x-client-screen": `${window.screen.width}x${window.screen.height}`,
          "x-client-timezone": Intl.DateTimeFormat().resolvedOptions().timeZone,
          "x-client-lang": navigator.language,
          "x-client-platform": navigator.platform,
          "x-auth-token": token,
          ...(options.headers || {}),
        },
        body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
        credentials: "same-origin",
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || ("HTTP " + res.status));
        err.status = res.status;
        throw err;
      }
      return data;
    }

    function toast(title, message, type = "info") {
      const el = document.createElement("div");
      el.className = "toast " + type;
      el.innerHTML = `<div><div style="font-weight:600">${title}</div><div style="font-size:12px;color:var(--text-secondary)">${message}</div></div>`;
      document.getElementById("toastContainer").appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function updateUserUI() {
      if (!user) return;
      document.getElementById("userAvatar").textContent = (user.name || "U").charAt(0).toUpperCase();
      document.getElementById("userName").textContent = user.name;
      document.getElementById("userIdDisplay").textContent = "ID: " + user.loginId;
      document.getElementById("coinCount").textContent = (user.coins || 0) + " Coins";
    }

    async function handleLogin() {
      const loginId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");

      if (!loginId) { err.textContent = "Enter your User ID"; err.classList.add("show"); return; }
      err.classList.remove("show");
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';

      try {
        const data = await api("/api/login", { method: "POST", body: { loginId, password, bulk: false } });
        if (data.user) {
          user = data.user;
          if (data.token) localStorage.setItem('rca_token', data.token);
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("dashboard").style.display = "block";
          updateUserUI();
          await loadLevels();
          toast("Welcome!", `Logged in as ${user.name}`, "success");
        }
      } catch (e) {
        err.textContent = e.message || "Login failed";
        err.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Login</span><i class="fas fa-arrow-right"></i>';
      }
    }

    async function handleLogout() {
      try { await api("/api/logout", { method: "POST", body: {} }); } catch (_) {}
      localStorage.removeItem('rca_token');
      user = null; allLevels = [];
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
      toast("Logged Out", "Session cleared", "info");
    }

    async function loadLevels() {
      const data = await api("/api/levels");
      allLevels = (data.users && data.users[0] && data.users[0].levels) || [];
      renderLevels();
      updateStats();
    }

    function renderLevels() {
      const box = document.getElementById("levelsContainer");
      box.innerHTML = "";
      allLevels.forEach((level) => {
        let skillsHtml = "";
        (level.skills || []).forEach((sk) => {
          let cls = sk.completed ? "completed" : sk.completedActivities > 0 ? "in-progress" : "not-completed";
          let statusText = sk.completed ? "Completed" : sk.completedActivities > 0 ? "In Progress" : "Pending";
          let chipsHtml = "";
          (sk.activitySetIds || []).forEach((actId) => {
            chipsHtml += `
              <div class="activity-chip">
                <span>ID: ${actId}</span>
                ${!sk.completed ? `<button class="btn btn-warning btn-sm" style="padding:2px 6px;font-size:9px;" onclick="triggerAutomation('single','${user.loginId}','${level.id}','${sk.key}','${actId}')">Solve Q</button>` : '<i class="fas fa-check" style="color:var(--success)"></i>'}
              </div>`;
          });
          skillsHtml += `
            <div class="skill-item ${cls}">
              <div class="skill-item-header">
                <div class="skill-item-info">
                  <i class="fas ${sk.icon}"></i>
                  <div class="skill-name">${sk.name}</div>
                </div>
                <div style="display:flex;gap:6px;align-items:center;">
                  <span class="skill-status ${cls}">${statusText}</span>
                  ${!sk.completed ? `<button class="btn btn-secondary btn-sm" style="padding:3px 8px;font-size:10px" onclick="triggerAutomation('skill','${user.loginId}','${level.id}','${sk.key}')">Solve Skill</button>` : ''}
                </div>
              </div>
              <div class="activity-list">${chipsHtml}</div>
            </div>`;
        });

        const card = document.createElement("div");
        card.className = "level-card";
        card.innerHTML = `
          <div class="level-header">
            <div class="level-info">
              <div class="level-badge ${level.color}">${level.name}</div>
              <div>
                <div class="level-title">${level.title}</div>
                <div class="level-subtitle">${level.subtitle}</div>
              </div>
            </div>
            ${!level.isCompleted ? `<button class="btn btn-primary btn-sm" onclick="triggerAutomation('level','${user.loginId}','${level.id}')"><i class="fas fa-play"></i> Solve Level ${level.name}</button>` : '<span style="color:var(--success);font-weight:600;"><i class="fas fa-check-circle"></i> Level Finished</span>'}
          </div>
          <div class="skills-grid">${skillsHtml}</div>
        `;
        box.appendChild(card);
      });
    }

    function updateStats() {
      let completed = 0, inProg = 0, tasks = 0;
      allLevels.forEach((l) => {
        if (l.isCompleted) completed++;
        else if ((l.skills || []).some((s) => s.completedActivities > 0 && !s.completed)) inProg++;
        (l.skills || []).forEach((s) => { if (!s.completed) tasks += (s.totalActivities - s.completedActivities); });
      });
      document.getElementById("completedLevels").textContent = completed;
      document.getElementById("inProgressLevels").textContent = inProg;
      document.getElementById("totalTasks").textContent = tasks;
    }

    function showProgress(title) {
      document.getElementById("progressTitle").textContent = title;
      document.getElementById("progressOverlay").classList.add("active");
      document.getElementById("progressLog").innerHTML = "";
      document.getElementById("progressBar").style.width = "0%";
    }
    function hideProgress() {
      document.getElementById("progressOverlay").classList.remove("active");
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
    function applyJob(job) {
      document.getElementById("progressBar").style.width = (job.percent || 0) + "%";
      document.getElementById("progressPercent").textContent = (job.percent || 0) + "%";
      document.getElementById("progressCount").textContent = (job.current || 0) + " / " + (job.total || 0);
      document.getElementById("currentTask").textContent = job.task || "";
      const log = document.getElementById("progressLog");
      log.innerHTML = "";
      (job.logs || []).forEach((item) => {
        const d = document.createElement("div");
        d.className = "log-item " + (item.level || "info");
        d.textContent = item.message;
        log.appendChild(d);
      });
      log.scrollTop = log.scrollHeight;
    }
    async function pollJob(jobId) {
      return new Promise((resolve, reject) => {
        pollTimer = setInterval(async () => {
          try {
            const job = await api("/api/jobs/" + jobId);
            applyJob(job);
            if (job.status === "done" || job.status === "error" || job.status === "cancelled") {
              clearInterval(pollTimer); pollTimer = null;
              if (job.status === "error") reject(new Error(job.error || "Execution failed"));
              else resolve(job);
            }
          } catch (e) { clearInterval(pollTimer); pollTimer = null; reject(e); }
        }, 1000);
      });
    }

    async function triggerAutomation(mode, targetUser, levelId = null, skillKey = null, activitySetId = null) {
      try {
        showProgress(`Executing [${mode.toUpperCase()}]...`);
        const payload = { mode, targetUser, levelId, skillKey, activitySetId };
        const data = await api("/api/complete", { method: "POST", body: payload });
        if (data.coins !== undefined && user) { user.coins = data.coins; updateUserUI(); }
        await pollJob(data.jobId);
        hideProgress();
        await loadLevels();
        toast("Done!", "Task completed successfully", "success");
      } catch (e) { hideProgress(); toast("Error", e.message, "error"); }
    }

    function showAddCoinModal() {
      coinStep = 1;
      document.getElementById("passkeyGroup").style.display = "block";
      document.getElementById("coinAmountGroup").style.display = "none";
      document.getElementById("passkeyInput").value = "";
      document.getElementById("coinAmount").value = "";
      document.getElementById("coinModalBtn").textContent = "Verify Key";
      document.getElementById("coinError").classList.remove("show");
      document.getElementById("coinModal").classList.add("active");
    }
    function closeCoinModal() { document.getElementById("coinModal").classList.remove("active"); }
    async function handleCoinStep() {
      const err = document.getElementById("coinError");
      err.classList.remove("show");
      if (coinStep === 1) {
        savedPasskey = document.getElementById("passkeyInput").value;
        if (!savedPasskey) { err.textContent = "Enter valid pass key"; err.classList.add("show"); return; }
        coinStep = 2;
        document.getElementById("passkeyGroup").style.display = "none";
        document.getElementById("coinAmountGroup").style.display = "block";
        document.getElementById("coinModalBtn").textContent = "Add Coins";
        return;
      }
      const amount = parseInt(document.getElementById("coinAmount").value, 10);
      if (!amount || amount < 1 || amount > 500) { err.textContent = "Enter amount (1-500)"; err.classList.add("show"); return; }
      try {
        const data = await api("/api/coins", { method: "POST", body: { passkey: savedPasskey, amount } });
        user.coins = data.coins;
        updateUserUI();
        closeCoinModal();
        toast("Coins Added", `${amount} coins added successfully`, "success");
      } catch (e) { err.textContent = e.message; err.classList.add("show"); }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light'); icon.className = 'fas fa-sun'; localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark'); icon.className = 'fas fa-moon'; localStorage.setItem('theme', 'dark');
      }
    }
    function toggleMobile() { document.getElementById('mobileMenu').classList.toggle('active'); }
    const saved = localStorage.getItem('theme');
    if (saved === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.getElementById('themeIcon').className = 'fas fa-sun'; }
    document.querySelectorAll('.mobile-menu a').forEach(link => { link.addEventListener('click', () => document.getElementById('mobileMenu').classList.remove('active')); });

    api("/api/me").then((d) => {
      if (d.user) { user = d.user; document.getElementById("loginScreen").style.display = "none"; document.getElementById("dashboard").style.display = "block"; updateUserUI(); loadLevels(); }
    }).catch(() => {});
  </script>
</body>
</html>
