<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IELTS Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #ec4899;
      --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
      --dark: #1e1b4b; --darker: #0f0e2e; --light: #f8fafc; --gray: #94a3b8;
      --glass: rgba(255,255,255,0.05); --glass-border: rgba(255,255,255,0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 50%, #1a1a2e 100%);
      min-height: 100vh; color: var(--light); overflow-x: hidden;
    }
    .bg-animation { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .bg-animation .circle {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3;
      animation: float 20s infinite ease-in-out;
    }
    .bg-animation .circle:nth-child(1) { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
    .bg-animation .circle:nth-child(2) { width: 300px; height: 300px; background: var(--secondary); bottom: -50px; right: -50px; animation-delay: -5s; }
    .bg-animation .circle:nth-child(3) { width: 250px; height: 250px; background: var(--info); top: 50%; left: 50%; animation-delay: -10s; }
    @keyframes float {
      0%, 100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(30px,-30px) scale(1.1); }
      66% { transform: translate(-20px,20px) scale(0.9); }
    }
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-box {
      background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 50px 40px; width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3); animation: slideUp 0.6s ease-out;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    .login-box .logo {
      width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 25px; font-size: 36px; box-shadow: 0 10px 30px rgba(99,102,241,0.4);
    }
    .login-box h1 {
      font-size: 28px; font-weight: 700; margin-bottom: 8px;
      background: linear-gradient(135deg, var(--light), var(--gray));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-box p { color: var(--gray); margin-bottom: 30px; font-size: 14px; }
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--gray); }
    .input-group input {
      width: 100%; padding: 16px 18px 16px 50px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border); border-radius: 14px; color: var(--light);
      font-size: 15px; font-family: inherit; outline: none;
    }
    .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(99,102,241,0.2); }
    .btn {
      width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 16px; font-weight: 600;
      font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: 0.3s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
    .btn-sm { padding: 10px 20px; width: auto; font-size: 14px; border-radius: 12px; }
    .btn-success { background: linear-gradient(135deg, var(--success), #16a34a); color: #fff; }
    .btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: #fff; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--light); border: 1px solid var(--glass-border); }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
    .error-msg.show { display: block; }

    .dashboard { display: none; min-height: 100vh; }
    .sidebar {
      position: fixed; left: 0; top: 0; width: 260px; height: 100vh;
      background: var(--glass); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border);
      padding: 25px 20px; z-index: 100;
    }
    .sidebar-header { display: flex; align-items: center; gap: 12px; padding-bottom: 25px; border-bottom: 1px solid var(--glass-border); margin-bottom: 25px; }
    .logo-icon {
      width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .user-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 18px; margin-bottom: 25px; border: 1px solid var(--glass-border); }
    .avatar {
      width: 55px; height: 55px; background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; margin-bottom: 12px;
    }
    .coin-display {
      display: flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706); padding: 10px 16px; border-radius: 12px;
      margin-bottom: 20px; font-weight: 600; font-size: 14px;
    }
    .nav-menu { list-style: none; }
    .nav-menu a {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px;
      color: var(--gray); text-decoration: none; font-size: 14px; font-weight: 500;
    }
    .nav-menu a:hover, .nav-menu a.active { background: rgba(99,102,241,0.15); color: var(--primary); }
    .main-content { margin-left: 260px; padding: 30px; min-height: 100vh; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
    .top-bar h2 { font-size: 26px; font-weight: 700; }
    .top-bar .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card {
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 24px;
    }
    .stat-card .icon {
      width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin-bottom: 16px;
    }
    .icon.purple { background: rgba(99,102,241,0.2); color: var(--primary); }
    .icon.green { background: rgba(34,197,94,0.2); color: var(--success); }
    .icon.pink { background: rgba(236,72,153,0.2); color: var(--secondary); }
    .icon.blue { background: rgba(59,130,246,0.2); color: var(--info); }
    .stat-card .label { font-size: 13px; color: var(--gray); margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .level-card {
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px;
      padding: 25px; margin-bottom: 20px;
    }
    .level-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--glass-border); }
    .level-info { display: flex; align-items: center; gap: 15px; }
    .level-badge { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
    .level-badge.a1 { background: linear-gradient(135deg,#22c55e,#16a34a); }
    .level-badge.a2 { background: linear-gradient(135deg,#3b82f6,#2563eb); }
    .level-badge.b1 { background: linear-gradient(135deg,#8b5cf6,#7c3aed); }
    .level-badge.b2 { background: linear-gradient(135deg,#ec4899,#db2777); }
    .level-badge.c1 { background: linear-gradient(135deg,#f59e0b,#d97706); }
    .level-badge.c2 { background: linear-gradient(135deg,#ef4444,#dc2626); }
    .level-title { font-size: 18px; font-weight: 600; }
    .level-subtitle { font-size: 12px; color: var(--gray); }
    .skills-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
    .skill-item {
      background: rgba(255,255,255,0.03); border-radius: 14px; padding: 18px; text-align: center;
      border: 1px solid transparent;
    }
    .skill-item.completed { border-color: var(--success); }
    .skill-item.not-completed { border-color: var(--danger); }
    .skill-item.in-progress { border-color: var(--warning); }
    .skill-item i { font-size: 28px; margin-bottom: 10px; }
    .skill-item.completed i { color: var(--success); }
    .skill-item.not-completed i { color: var(--danger); }
    .skill-item.in-progress i { color: var(--warning); }
    .skill-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .skill-status { font-size: 11px; padding: 4px 10px; border-radius: 20px; display: inline-block; }
    .skill-status.completed { background: rgba(34,197,94,0.15); color: var(--success); }
    .skill-status.not-completed { background: rgba(239,68,68,0.15); color: var(--danger); }
    .skill-status.in-progress { background: rgba(245,158,11,0.15); color: var(--warning); }
    .level-actions { display: flex; gap: 12px; }
    .level-actions .btn { flex: 1; padding: 12px; font-size: 14px; }

    .progress-overlay {
      position: fixed; inset: 0; background: rgba(15,14,46,0.95); backdrop-filter: blur(10px);
      z-index: 1000; display: none; justify-content: center; align-items: center; flex-direction: column;
    }
    .progress-overlay.active { display: flex; }
    .progress-box {
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 40px; width: 90%; max-width: 500px; text-align: center;
    }
    .progress-icon {
      width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px;
      margin: 0 auto 25px;
    }
    .progress-bar-container { background: rgba(255,255,255,0.05); border-radius: 12px; height: 12px; overflow: hidden; margin: 15px 0; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width .4s; border-radius: 12px; }
    .progress-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--gray); }
    .progress-log {
      margin-top: 20px; max-height: 200px; overflow-y: auto; text-align: left;
      background: rgba(0,0,0,0.2); border-radius: 12px; padding: 15px; font-size: 12px;
    }
    .log-item { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--gray); }
    .log-item.success { color: var(--success); }
    .log-item.error { color: var(--danger); }
    .log-item.info { color: var(--info); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,14,46,0.8); backdrop-filter: blur(10px);
      z-index: 2000; display: none; justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 35px; width: 90%; max-width: 420px;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn-group .btn { flex: 1; }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; min-width: 280px;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.warning { border-left: 4px solid var(--warning); }
    .toast.info { border-left: 4px solid var(--info); }
    .toast-title { font-weight: 600; font-size: 14px; }
    .toast-message { font-size: 12px; color: var(--gray); }

    @media (max-width: 1200px) {
      .stats-grid, .skills-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
      .stats-grid, .skills-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="circle"></div><div class="circle"></div><div class="circle"></div></div>
  <div class="toast-container" id="toastContainer"></div>

  <div class="login-container" id="loginScreen">
    <div class="login-box">
      <div class="logo"><i class="fas fa-graduation-cap"></i></div>
      <h1>IELTS Dashboard</h1>
      <p>Secure backend mode — tokens stay on server</p>
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="userId" placeholder="User ID (loginId)" autocomplete="username" />
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" value="Password" />
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
        <span>Login</span><i class="fas fa-arrow-right"></i>
      </button>
      <div class="error-msg" id="loginError"></div>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <div><h3 style="font-size:18px;font-weight:700">IELTS Pro</h3><span style="font-size:11px;color:var(--gray)">Secure Backend</span></div>
      </div>
      <div class="user-card">
        <div class="avatar" id="userAvatar">U</div>
        <div class="name" id="userName" style="font-weight:600">User</div>
        <div class="id" id="userIdDisplay" style="font-size:12px;color:var(--gray)">ID: --</div>
      </div>
      <div class="coin-display"><i class="fas fa-coins"></i><span id="coinCount">0 Coins</span></div>
      <ul class="nav-menu">
        <li><a href="#" class="active" onclick="scrollToLevels()"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="#" onclick="showAddCoinModal()"><i class="fas fa-coins"></i> Add Coins</a></li>
        <li><a href="#" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </div>
    <div class="main-content">
      <div class="top-bar">
        <h2>Dashboard Overview</h2>
        <div class="actions">
          <button class="btn btn-warning btn-sm" onclick="showAddCoinModal()"><i class="fas fa-coins"></i> Add Coins</button>
          <button class="btn btn-success btn-sm" onclick="completeAll()"><i class="fas fa-check-double"></i> Complete All Tasks</button>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="icon purple"><i class="fas fa-layer-group"></i></div><div class="label">Total Levels</div><div class="value" id="totalLevels">6</div></div>
        <div class="stat-card"><div class="icon green"><i class="fas fa-check-circle"></i></div><div class="label">Completed</div><div class="value" id="completedLevels">0</div></div>
        <div class="stat-card"><div class="icon pink"><i class="fas fa-clock"></i></div><div class="label">In Progress</div><div class="value" id="inProgressLevels">0</div></div>
        <div class="stat-card"><div class="icon blue"><i class="fas fa-tasks"></i></div><div class="label">Total Tasks</div><div class="value" id="totalTasks">0</div></div>
      </div>
      <div id="levelsContainer"></div>
    </div>
  </div>

  <div class="progress-overlay" id="progressOverlay">
    <div class="progress-box">
      <div class="progress-icon"><i class="fas fa-cog fa-spin"></i></div>
      <h3 id="progressTitle">Processing...</h3>
      <div id="currentTask" style="color:var(--gray);font-size:14px;margin-bottom:10px">Initializing...</div>
      <div class="progress-bar-container"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="progress-stats"><span id="progressPercent">0%</span><span id="progressCount">0 / 0</span></div>
      <div class="progress-log" id="progressLog"></div>
    </div>
  </div>

  <div class="modal-overlay" id="coinModal">
    <div class="modal-box">
      <h3 style="margin-bottom:20px"><i class="fas fa-coins" style="color:var(--warning)"></i> Add Coins</h3>
      <div class="input-group" id="passkeyGroup">
        <i class="fas fa-key"></i>
        <input type="password" id="passkeyInput" placeholder="Enter Pass Key" />
      </div>
      <div class="input-group" id="coinAmountGroup" style="display:none">
        <i class="fas fa-coins"></i>
        <input type="number" id="coinAmount" placeholder="Amount (1-1000)" min="1" max="1000" />
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="closeCoinModal()">Cancel</button>
        <button class="btn btn-primary" id="coinModalBtn" onclick="handleCoinStep()">Verify</button>
      </div>
      <div class="error-msg" id="coinError"></div>
    </div>
  </div>

  <script>
    // Thin client — no RCA tokens, no answer logic, no passkey secrets
    let user = null;
    let levels = [];
    let coinStep = 1;
    let pollTimer = null;

    async function api(path, options) {
      options = options || {};
      const res = await fetch(path, {
        method: options.method || "GET",
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
        credentials: "same-origin",
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || ("HTTP " + res.status));
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function toast(title, message, type) {
      type = type || "info";
      const el = document.createElement("div");
      el.className = "toast " + type;
      const icons = { success: "fa-check-circle", error: "fa-times-circle", warning: "fa-exclamation-triangle", info: "fa-info-circle" };
      el.innerHTML = '<i class="fas ' + icons[type] + '"></i><div><div class="toast-title">' + title + '</div><div class="toast-message">' + message + '</div></div>';
      document.getElementById("toastContainer").appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function updateUserUI() {
      if (!user) return;
      document.getElementById("userAvatar").textContent = (user.name || "U").charAt(0).toUpperCase();
      document.getElementById("userName").textContent = user.name;
      document.getElementById("userIdDisplay").textContent = "ID: " + user.loginId + " | L:" + user.learnerId;
      document.getElementById("coinCount").textContent = user.coins + " Coins";
    }

    async function handleLogin() {
      const loginId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");
      if (!loginId) { err.textContent = "Enter User ID"; err.classList.add("show"); return; }
      err.classList.remove("show");
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';
      try {
        const data = await api("/api/login", { method: "POST", body: { loginId, password } });
        user = data.user;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        updateUserUI();
        await loadLevels();
        toast("Welcome!", "Logged in as " + user.name, "success");
      } catch (e) {
        err.textContent = e.message || "Login failed";
        err.classList.add("show");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Login</span><i class="fas fa-arrow-right"></i>';
      }
    }

    async function handleLogout() {
      try { await api("/api/logout", { method: "POST", body: {} }); } catch (_) {}
      user = null;
      levels = [];
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
      toast("Logged Out", "Session cleared", "info");
    }

    async function loadLevels() {
      const data = await api("/api/levels");
      levels = data.levels || [];
      renderLevels();
      updateStats();
    }

    function renderLevels() {
      const box = document.getElementById("levelsContainer");
      box.innerHTML = "";
      levels.forEach((level) => {
        let allDone = true, anyProg = false, skillsHtml = "";
        (level.skills || []).forEach((sk) => {
          let cls = "not-completed", text = "Not Completed", badge = "not-completed";
          if (sk.completed) { cls = "completed"; text = "Completed"; badge = "completed"; }
          else if (sk.completedActivities > 0) { cls = "in-progress"; text = "In Progress"; badge = "in-progress"; anyProg = true; allDone = false; }
          else allDone = false;
          skillsHtml += '<div class="skill-item ' + cls + '"><i class="fas ' + sk.icon + '"></i><div class="skill-name">' + sk.name + '</div><div class="skill-status ' + badge + '">' + text + '</div></div>';
        });
        const st = allDone ? "All Completed" : anyProg ? "In Progress" : "Not Started";
        const col = allDone ? "var(--success)" : anyProg ? "var(--warning)" : "var(--danger)";
        const card = document.createElement("div");
        card.className = "level-card";
        card.innerHTML =
          '<div class="level-header"><div class="level-info"><div class="level-badge ' + level.color + '">' + level.name +
          '</div><div><div class="level-title">' + level.title + '</div><div class="level-subtitle">' + level.subtitle +
          ' • <span style="color:' + col + '">' + st + '</span></div></div></div></div>' +
          '<div class="skills-grid">' + skillsHtml + '</div>' +
          '<div class="level-actions"><button class="btn btn-primary" onclick="completeLevel(' + level.id + ')"><i class="fas fa-play"></i> Complete All Tasks</button></div>';
        box.appendChild(card);
      });
    }

    function updateStats() {
      let completed = 0, inProg = 0, tasks = 0;
      levels.forEach((l) => {
        if (l.isCompleted) completed++;
        else if ((l.skills || []).some((s) => s.completedActivities > 0 && !s.completed)) inProg++;
        (l.skills || []).forEach((s) => { tasks += s.totalActivities || 0; });
      });
      document.getElementById("completedLevels").textContent = completed;
      document.getElementById("inProgressLevels").textContent = inProg;
      document.getElementById("totalTasks").textContent = tasks;
      document.getElementById("totalLevels").textContent = levels.length;
    }

    function showProgress(title) {
      document.getElementById("progressTitle").textContent = title;
      document.getElementById("progressOverlay").classList.add("active");
      document.getElementById("progressLog").innerHTML = "";
      document.getElementById("progressBar").style.width = "0%";
    }
    function hideProgress() {
      document.getElementById("progressOverlay").classList.remove("active");
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }
    function applyJob(job) {
      document.getElementById("progressBar").style.width = (job.percent || 0) + "%";
      document.getElementById("progressPercent").textContent = (job.percent || 0) + "%";
      document.getElementById("progressCount").textContent = (job.current || 0) + " / " + (job.total || 0);
      document.getElementById("currentTask").textContent = job.task || "";
      const log = document.getElementById("progressLog");
      log.innerHTML = "";
      (job.logs || []).forEach((item) => {
        const d = document.createElement("div");
        d.className = "log-item " + (item.level || "info");
        d.textContent = "[" + (item.t || "").slice(11, 19) + "] " + item.message;
        log.appendChild(d);
      });
      log.scrollTop = log.scrollHeight;
    }

    async function pollJob(jobId) {
      return new Promise((resolve, reject) => {
        pollTimer = setInterval(async () => {
          try {
            const job = await api("/api/jobs/" + jobId);
            applyJob(job);
            if (job.status === "done" || job.status === "error" || job.status === "cancelled") {
              clearInterval(pollTimer);
              pollTimer = null;
              if (job.status === "error") reject(new Error(job.error || "Job failed"));
              else resolve(job);
            }
          } catch (e) {
            clearInterval(pollTimer);
            pollTimer = null;
            reject(e);
          }
        }, 1500);
      });
    }

    async function completeLevel(levelId) {
      try {
        showProgress("Completing level...");
        const data = await api("/api/complete", { method: "POST", body: { mode: "level", levelId } });
        user.coins = data.coins;
        updateUserUI();
        await pollJob(data.jobId);
        hideProgress();
        await loadLevels();
        toast("Success", "Level tasks submitted", "success");
      } catch (e) {
        hideProgress();
        toast("Error", e.message, "error");
        if (e.status === 402) toast("Coins", "Need more coins", "warning");
      }
    }

    async function completeAll() {
      try {
        showProgress("Completing all levels...");
        const data = await api("/api/complete", { method: "POST", body: { mode: "all" } });
        user.coins = data.coins;
        updateUserUI();
        await pollJob(data.jobId);
        hideProgress();
        await loadLevels();
        toast("Success", "All tasks submitted", "success");
      } catch (e) {
        hideProgress();
        toast("Error", e.message, "error");
      }
    }

    function showAddCoinModal() {
      coinStep = 1;
      document.getElementById("passkeyGroup").style.display = "block";
      document.getElementById("coinAmountGroup").style.display = "none";
      document.getElementById("passkeyInput").value = "";
      document.getElementById("coinAmount").value = "";
      document.getElementById("coinModalBtn").textContent = "Verify";
      document.getElementById("coinError").classList.remove("show");
      document.getElementById("coinModal").classList.add("active");
    }
    function closeCoinModal() {
      document.getElementById("coinModal").classList.remove("active");
    }

    let savedPasskey = "";

    async function handleCoinStep() {
      const err = document.getElementById("coinError");
      err.classList.remove("show");
      if (coinStep === 1) {
        savedPasskey = document.getElementById("passkeyInput").value;
        if (!savedPasskey) {
          err.textContent = "Enter pass key";
          err.classList.add("show");
          return;
        }
        coinStep = 2;
        document.getElementById("passkeyGroup").style.display = "none";
        document.getElementById("coinAmountGroup").style.display = "block";
        document.getElementById("coinModalBtn").textContent = "Add Coins";
        return;
      }
      const amount = parseInt(document.getElementById("coinAmount").value, 10);
      if (!amount || amount < 1 || amount > 1000) {
        err.textContent = "Enter amount 1-1000";
        err.classList.add("show");
        return;
      }
      try {
        const data = await api("/api/coins", {
          method: "POST",
          body: { passkey: savedPasskey, amount },
        });
        user.coins = data.coins;
        updateUserUI();
        closeCoinModal();
        toast("Coins", amount + " coins added", "success");
      } catch (e) {
        err.textContent = e.message;
        err.classList.add("show");
      }
    }

    function scrollToLevels() {
      document.getElementById("levelsContainer").scrollIntoView({ behavior: "smooth" });
    }

    document.getElementById("userId").addEventListener("keypress", (e) => { if (e.key === "Enter") handleLogin(); });
    document.getElementById("coinModal").addEventListener("click", (e) => {
      if (e.target === document.getElementById("coinModal")) closeCoinModal();
    });

    // restore session if cookie still valid
    api("/api/me").then((d) => {
      user = d.user;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      updateUserUI();
      return loadLevels();
    }).catch(() => {});
  </script>
</body>
</html>
